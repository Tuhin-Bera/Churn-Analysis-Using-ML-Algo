# ==============================================================================
# docker-compose.yml — Local Development Stack (App + PostgreSQL)
# ==============================================================================
# Spins up:
#   - db:  PostgreSQL 15 (persistent volume, auto-creates telecom_churn database)
#   - app: Streamlit application wired to the Postgres container
#
# Usage:
#   docker compose up --build          # First run (builds image + trains model)
#   docker compose up                  # Subsequent runs
#   docker compose down                # Stop and remove containers
#   docker compose down -v             # Also remove the database volume
# ==============================================================================

version: "3.9"

services:

  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: churn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       telecom_churn
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      # Named volume keeps data between container restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telecom_churn"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Streamlit Application Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      # Wire the app to the PostgreSQL container
      PG_HOST:     db
      PG_PORT:     5432
      PG_DATABASE: telecom_churn
      PG_USER:     postgres
      PG_PASSWORD: ${PG_PASSWORD:-changeme}
      APP_ENV:     production
    env_file:
      # Loads additional variables from .env if present (ignored by git)
      - .env
    volumes:
      # Mount outputs so trained models persist between container rebuilds
      - ./outputs:/app/outputs
      # Mount data folder (CSV must already be present locally)
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Persistent storage for PostgreSQL data
  postgres_data:
    driver: local
